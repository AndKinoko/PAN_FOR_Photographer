{% extends 'base.html' %}

{% block title %}重置密码 - 局域网网盘{% endblock %}

{% block extra_css %}
<style>
    .auth-page {
        min-height: calc(100vh - var(--header-height));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-8) var(--space-4);
    }
    .auth-card {
        max-width: 420px;
        width: 100%;
        animation: scaleIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .auth-card .card-body {
        padding: var(--space-8);
    }
    .auth-icon {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, var(--accent-400), var(--accent-600));
        border-radius: var(--radius-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: #fff;
        margin: 0 auto var(--space-5);
        box-shadow: 0 8px 24px rgba(201, 151, 39, 0.3);
    }
    .auth-heading {
        text-align: center;
        margin-bottom: var(--space-6);
    }
    .auth-heading h2 {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: var(--space-2);
        letter-spacing: -0.02em;
    }
    .auth-heading p {
        color: var(--text-secondary);
        font-size: 0.85rem;
    }
    .auth-footer-link {
        text-align: center;
        margin-top: var(--space-4);
    }
    .auth-footer-link a {
        color: var(--text-tertiary);
        font-size: 0.8rem;
        text-decoration: none;
        transition: color var(--transition-fast);
    }
    .auth-footer-link a:hover {
        color: var(--accent);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="card">
            <div class="card-body">
                <div class="auth-icon">
                    <i class="fas fa-key"></i>
                </div>

                <div class="auth-heading">
                    <h2>重置密码</h2>
                    <p>输入注册邮箱，我们将发送重置链接</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_email" class="form-label">邮箱</label>
                        <input type="email" class="form-input" id="id_email" name="email"
                               required placeholder="请输入注册邮箱"
                               value="{{ form.email.value|default:'' }}">
                        {% if form.email.errors %}
                        <div class="form-error">
                            {% for error in form.email.errors %}{{ error }}{% endfor %}
                        </div>
                        {% endif %}
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-paper-plane"></i> 发送重置邮件
                    </button>
                </form>

                <div class="auth-footer-link">
                    <a href="{% url 'accounts:login' %}">
                        <i class="fas fa-arrow-left" style="margin-right: 4px;"></i>返回登录
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
