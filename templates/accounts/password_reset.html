{% extends 'base.html' %}

{% block title %}重置密码 - 局域网网盘{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0;">
    <div style="max-width: 400px; width: 100%;">
        <div class="card-modern">
            <div class="card-body" style="padding: 32px;">
                <div style="text-align: center; margin-bottom: 24px;">
                    <h4 style="font-weight: 700; color: var(--text-primary);">重置密码</h4>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">输入注册邮箱，我们将发送重置链接</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.email.label_tag }}
                    <input type="email" name="email" class="form-control-modern" required placeholder="请输入邮箱" style="margin-bottom: 16px;">
                    {% if form.email.errors %}<div style="color: var(--danger); font-size: 0.8rem;">{{ form.email.errors }}</div>{% endif %}
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                        <i class="fas fa-paper-plane"></i> 发送重置邮件
                    </button>
                </form>
                <div style="text-align: center; margin-top: 16px;">
                    <a href="{% url 'accounts:login' %}" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">返回登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
