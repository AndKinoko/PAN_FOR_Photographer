{% extends 'base.html' %}

{% block title %}设置新密码 - 局域网网盘{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0;">
    <div style="max-width: 400px; width: 100%;">
        <div class="card-modern">
            <div class="card-body" style="padding: 32px;">
                <div style="text-align: center; margin-bottom: 24px;">
                    <h4 style="font-weight: 700; color: var(--text-primary);">设置新密码</h4>
                </div>
                {% if validlink %}
                <form method="post">
                    {% csrf_token %}
                    <label class="form-label-modern">新密码</label>
                    <input type="password" name="new_password1" class="form-control-modern" required style="margin-bottom: 12px;">
                    <label class="form-label-modern">确认新密码</label>
                    <input type="password" name="new_password2" class="form-control-modern" required style="margin-bottom: 16px;">
                    {% if form.errors %}<div style="color: var(--danger); font-size: 0.8rem; margin-bottom: 12px;">{{ form.errors }}</div>{% endif %}
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">确认修改</button>
                </form>
                {% else %}
                <div class="alert-modern alert-danger">链接无效或已过期，请重新申请。</div>
                <a href="{% url 'accounts:password_reset' %}" class="btn btn-outline" style="width: 100%; justify-content: center; margin-top: 12px;">重新申请</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
