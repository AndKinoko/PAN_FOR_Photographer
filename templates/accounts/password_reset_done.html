{% extends 'base.html' %}

{% block title %}邮件已发送 - 局域网网盘{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0;">
    <div style="max-width: 400px; width: 100%;">
        <div class="card-modern">
            <div class="card-body" style="padding: 32px; text-align: center;">
                <i class="fas fa-check-circle" style="font-size: 2.5rem; color: var(--success); margin-bottom: 16px;"></i>
                <h4 style="color: var(--text-primary);">邮件已发送</h4>
                <p style="color: var(--text-muted); font-size: 0.9rem;">如果该邮箱已注册，请查收重置链接。</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width: 100%; justify-content: center;">返回登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
