{% extends 'base.html' %}

{% block title %}密码重置成功 - 局域网网盘{% endblock %}

{% block extra_css %}
<style>
    .auth-page {
        min-height: calc(100vh - var(--header-height));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-8) var(--space-4);
    }
    .auth-card {
        max-width: 420px;
        width: 100%;
        animation: scaleIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .auth-card .card-body {
        padding: var(--space-8);
    }
    .auth-success-icon {
        width: 72px;
        height: 72px;
        background: var(--success-bg);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--success);
        margin: 0 auto var(--space-5);
    }
    .auth-heading {
        text-align: center;
        margin-bottom: var(--space-6);
    }
    .auth-heading h2 {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: var(--space-2);
        letter-spacing: -0.02em;
    }
    .auth-heading p {
        color: var(--text-secondary);
        font-size: 0.85rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="card">
            <div class="card-body text-center">
                <div class="auth-success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>

                <div class="auth-heading">
                    <h2>密码重置成功</h2>
                    <p>请使用新密码登录</p>
                </div>

                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">
                    <i class="fas fa-right-to-bracket"></i> 去登录
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
