{% extends 'base.html' %}
{% load static %}

{% block title %}分享已过期 - 局域网网盘{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="card-modern">
            <div class="card-header text-center">
                <h4 class="mb-0"><i class="fas fa-clock me-2"></i>分享链接已过期</h4>
            </div>
            <div class="card-body text-center">
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="fas fa-history"></i>
                    </div>
                    <h4>抱歉，此分享链接已过期</h4>
                    <p>您尝试访问的分享链接已经过期，无法继续访问。</p>
                </div>
                
                <div class="alert alert-modern alert-info text-start">
                    <i class="fas fa-info-circle me-2"></i>
                    分享链接信息：
                    <ul class="list-unstyled mt-2 mb-0">
                        <li class="mb-1">文件名：<strong>{{ share.file.original_name }}</strong></li>
                        <li>过期时间：{{ share.expires_at|date:"Y-m-d H:i" }}</li>
                    </ul>
                </div>
                
                <div class="mt-4 d-flex flex-wrap gap-2 justify-content-center">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary-modern btn-modern">
                        <i class="fas fa-sign-in-alt me-1"></i> 登录系统
                    </a>
                    <a href="/" class="btn btn-outline-modern btn-modern">
                        <i class="fas fa-home me-1"></i> 返回首页
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
